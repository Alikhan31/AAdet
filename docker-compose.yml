services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit_secret
      POSTGRES_DB: habit_tracking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit -d habit_tracking"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./habit-tracking-back
    ports:
      - "8001:8000"
    env_file:
      - ./habit-tracking-back/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://habit:habit_secret@postgres:5432/habit_tracking
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  front:
    build:
      context: ./habit-tracking-front
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:

